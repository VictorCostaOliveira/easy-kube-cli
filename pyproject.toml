[build-system]
requires = ["setuptools>=64.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "easy-kube-cli"
version = "1.0.0"
description = "CLI para simplificar operações diárias no Kubernetes (AWS EKS e Azure AKS)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click==8.1.7",
    "kubernetes==29.0.0",
    "rich==13.7.0",
    "inquirer==3.1.3",
    "PyYAML==6.0.1",
    "urllib3>=1.26.18,<2",
]

[project.scripts]
kube-cli = "kube_cli:cli"
ekli = "kube_cli:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["kube_cli*"]
